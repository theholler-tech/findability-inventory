name: GSC sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client
        run: pip install google-api-python-client google-auth
      - name: Pull Search Console
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: python scripts/sync_gsc.py
      - name: Commit snapshot
        run: |
          git config user.name "gclg-gsc-reader"
          git config user.email "gclg-gsc-reader@users.noreply.github.com"
          git add data/gsc
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update GSC snapshot"
            git push
          fi
