name: Bing sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Bing Webmaster
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: python scripts/sync_bing.py
      - name: Commit snapshot
        run: |
          git config user.name "gclg-bing-reader"
          git config user.email "gclg-bing-reader@users.noreply.github.com"
          git add data/bing
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update Bing snapshot"
            git push
          fi
